name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-lock:
    name: lint-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Python toolchain
        run: uv python install
      - name: Sync locked deps
        run: uv sync --locked --group dev
      - name: uv lock --check
        run: uv lock --check
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy recallum

  unit-plugin:
    name: unit-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --group dev
      - name: Unit tests (excl. vertical/traefik/integration)
        run: >
          uv run pytest tests/unit
          -m "not integration and not vertical and not traefik"
          --tb=short
      - name: Plugin / manifest tests
        run: uv run pytest plugins/recallum-memory/tests -q --tb=short

  openapi-snapshot:
    name: openapi-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --group dev
      - name: OpenAPI snapshot check
        run: uv run python scripts/export_web_openapi.py --check
      - name: Snapshot unit contract
        run: uv run pytest tests/unit/test_self_service_api.py::test_versioned_openapi_matches_web_app_only -q --tb=short

  compose-supported:
    name: compose-supported
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate supported compose only
        run: bash scripts/check_compose_supported.sh
      - name: Refuse dokploy as required input
        run: |
          test -f deploy/dokploy-compose.yml
          if docker compose -f deploy/dokploy-compose.yml config >/tmp/dokploy.yml 2>/tmp/dokploy.err; then
            echo "dokploy compose parses but is not part of the supported gate"
          fi
          ! grep -q 'deploy/dokploy-compose.yml' scripts/check_compose_supported.sh | grep include || true
          bash -c '! scripts/check_compose_supported.sh --include-dokploy'

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -f deploy/Dockerfile -t recallum:ci .
      - name: Entrypoint is installed and executable
        run: docker run --rm --entrypoint /bin/sh recallum:ci -c 'test -x /usr/local/bin/recallum-entrypoint'
      - name: Explicit commands pass through the entrypoint
        run: docker run --rm recallum:ci /bin/echo entrypoint-passthrough-ok

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --group dev
      - name: PostgreSQL + pgvector + embedding HTTP stub
        run: bash scripts/pytest_require_executed.sh tests/integration -m integration --tb=short

  vertical-granian:
    name: vertical-granian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --group dev
      - name: External Granian vertical contract
        run: bash scripts/pytest_require_executed.sh tests/vertical -m vertical --tb=short

  traefik-pinned:
    name: traefik-pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --group dev
      - name: Pinned Traefik contract
        run: bash scripts/pytest_require_executed.sh tests/traefik -m traefik --tb=short

  # Not a required check until production moves to 3.15. Compiled deps must
  # come from wheels; PyYAML 6.0.3 is the exception and builds from its sdist
  # (pure Python when the C extension cannot be compiled).
  python-315:
    name: python-3.15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Python 3.15
        run: uv python install 3.15
      - name: Sync locked dependencies
        run: >
          uv sync --python 3.15 --locked --group dev
          --no-build-package asyncpg
          --no-build-package granian
          --no-build-package argon2-cffi-bindings
          --no-build-package pydantic-core
          --no-build-package markupsafe
          --no-build-package cffi
          --no-build-package greenlet
          --no-build-package watchfiles
          --no-build-package rpds-py
          --no-build-package cryptography
          --no-build-package mypy
      - name: Report whether PyYAML built its C extension
        run: uv run --python 3.15 python -c 'import yaml; print("yaml.__with_libyaml__", yaml.__with_libyaml__)'
      - name: Unit tests
        run: >
          uv run --python 3.15 pytest tests/unit
          -m "not integration and not vertical and not traefik"
          --tb=short
      - name: Plugin / manifest tests
        run: uv run --python 3.15 pytest plugins/recallum-memory/tests -q --tb=short

  docker-python-315:
    name: docker-python-3.15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image on Python 3.15
        run: >
          docker build -f deploy/Dockerfile
          --target production
          --build-arg PYTHON_IMAGE=python:3.15-slim
          -t recallum:py315 .
      - name: Entrypoint passes commands through on 3.15
        run: docker run --rm recallum:py315 /bin/echo entrypoint-passthrough-ok
      - name: Build test image on Python 3.15
        run: >
          docker build -f deploy/Dockerfile
          --target ci
          --build-arg PYTHON_IMAGE=python:3.15-slim
          -t recallum:py315-ci .
      - name: PyYAML pure-Python fallback inside the image
        run: >
          docker run --rm --entrypoint /app/.venv/bin/python recallum:py315
          -c 'import yaml; assert yaml.__with_libyaml__ is False, yaml.__with_libyaml__'
      - name: Unit tests inside the 3.15 image
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/src:ro"
          -w /src
          -e PYTHONDONTWRITEBYTECODE=1
          --entrypoint /app/.venv/bin/pytest
          recallum:py315-ci
          /src/tests/unit
          -m "not integration and not vertical and not traefik"
          -o cache_dir=/tmp/pytest-cache
          --tb=short
