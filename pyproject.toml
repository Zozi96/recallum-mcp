[project]
name = "recallum"
version = "0.20.0"
description = "Private, self-hosted persistent memory for AI coding agents, exposed over MCP."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "fastmcp>=3.4,<4",
    "dependency-injector>=4.46",
    "email-validator>=2.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "granian>=2.8.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
recallum-admin = "recallum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recallum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "integration: requires a real PostgreSQL+pgvector database (RECALLUM_TEST_DATABASE_URL or Docker)",
    "vertical: external Granian process contract on ephemeral ports",
    "traefik: pinned Traefik reverse-proxy contract (Docker)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
