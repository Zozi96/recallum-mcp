[project]
name = "recallum"
version = "0.26.0"
description = "Private, self-hosted persistent memory for AI coding agents, exposed over MCP."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "fastmcp>=3.4,<4",
    "dependency-injector>=4.46",
    "email-validator>=2.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "granian>=2.8.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=2.3.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
recallum-admin = "recallum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recallum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "integration: requires a real PostgreSQL+pgvector database (RECALLUM_TEST_DATABASE_URL or Docker)",
    "vertical: external Granian process contract on ephemeral ports",
    "traefik: pinned Traefik reverse-proxy contract (Docker)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
# Baseline gradual (2026-09-05): se endurecen los módulos con falsos positivos
# de SQLAlchemy/FastAPI y los puntos de fricción conocidos; el resto corre
# estricto. Cada override está listado explícitamente; objetivo: eliminarlos.
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  # Fricción declarada: decoradores FastMCP/FastAPI y genéricos de SQLAlchemy
  # producen falsos positivos sin refactor de anotaciones. Suprimir módulo a
  # módulo, no global.
  "recallum.app",
  "recallum.container",
  "recallum.mcp.*",
  "recallum.web.*",
  "recallum.db.models",
  "recallum.db.repositories.*",
  "recallum.migrations.*",
  "recallum.cli",
  "recallum.diagnostics",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Baseline de errores reales conocidos (2026-09-05). Cada supresión es por
# código de error y por archivo, no global; varias se resuelven en el cambio
# uniform-embedding-degradation. Objetivo: eliminar esta sección.
[[tool.mypy.overrides]]
module = [
  "recallum.evaluation",
  "recallum.telemetry.http",
  "recallum.cli",
]
disable_error_code = ["no-any-return", "attr-defined"]

[[tool.mypy.overrides]]
module = [
  "recallum.http_boundary",
  "recallum.memory.context",
  "recallum.auth.web_sessions",
  "recallum.telemetry.repository",
]
disable_error_code = ["assignment", "arg-type", "return"]

[[tool.mypy.overrides]]
module = [
  "recallum.memory.token_budget",
  "recallum.memory.profile_select",
]
disable_error_code = ["unused-ignore"]
