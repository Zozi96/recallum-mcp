# ALTERNATIVE: single Compose stack for Dokploy.
#
# The primary deployment is separate Dokploy resources (Database + Applications)
# with migrations as a pre-deploy command — see the "Dokploy deployment
# (separate services)" section in docs/operations.md. Use THIS file only if you
# prefer deploying everything as one Dokploy Compose stack instead.
#
# Traefik publishes only Recallum over HTTPS; PostgreSQL and Ollama remain on
# the private network with persistent volumes. Adjust the Host rule and attach
# the existing Dokploy/Traefik network (external) to your setup.
services:
  recallum:
    image: recallum:1.0.0  # versión pineada: bump explícito en cada release del runbook
    environment:
      RECALLUM__DATABASE__URL: postgresql+asyncpg://recallum:CHANGE_ME@postgres:5432/recallum
      RECALLUM__OLLAMA__URL: http://ollama:11434
      RECALLUM__TELEMETRY__METRICS_TOKEN: CHANGE_ME
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - recallum-private
      - dokploy-network
    mem_limit: 512m
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      # /metrics stays off the public router; scrape on the private network.
      traefik.http.routers.recallum.rule: Host(`recallum.example.com`) && !Path(`/metrics`)
      traefik.http.routers.recallum.entrypoints: websecure
      traefik.http.routers.recallum.tls.certresolver: letsencrypt
      traefik.http.services.recallum.loadbalancer.server.port: "8000"

  migrate:
    image: recallum:1.0.0  # versión pineada: bump explícito en cada release del runbook
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      RECALLUM__DATABASE__URL: postgresql+asyncpg://recallum:CHANGE_ME@postgres:5432/recallum
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recallum-private
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: recallum_admin
      POSTGRES_PASSWORD: CHANGE_ADMIN_PASSWORD
      POSTGRES_DB: recallum
      RECALLUM_APP_USER: recallum
      RECALLUM_APP_PASSWORD: CHANGE_ME
    volumes:
      - recallum-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - recallum-private
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallum_admin -d recallum"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.12.6  # fijada: sustituye a :latest
    volumes:
      - recallum-ollama:/root/.ollama
    networks:
      - recallum-private
    mem_limit: 1536m
    restart: unless-stopped

networks:
  recallum-private:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  recallum-pgdata:
  recallum-ollama:
