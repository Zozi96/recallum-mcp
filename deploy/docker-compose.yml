# Full local stack: Recallum + dedicated PostgreSQL with pgvector + private Ollama.
# Only Recallum publishes a port; PostgreSQL and Ollama stay on the private network.
services:
  recallum:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      RECALLUM__DATABASE__URL: postgresql+asyncpg://recallum:recallum@postgres:5432/recallum
      RECALLUM__OLLAMA__URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - recallum
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # No separate `migrate` service: the image's entrypoint migrates before it
  # serves, so compose and the managed deployment run the identical sequence
  # and there is only one ordering to get right.

  postgres:
    image: pgvector/pgvector:pg17  # digest: sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: recallum_admin
      POSTGRES_PASSWORD: recallum_admin
      POSTGRES_DB: recallum
      RECALLUM_APP_USER: recallum
      RECALLUM_APP_PASSWORD: recallum
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - recallum
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallum_admin -d recallum"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Intentionally no published ports: private network only.

  ollama:
    image: ollama/ollama:0.12.6  # fijada: sustituye a :latest; digest de referencia sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    volumes:
      - ollama:/root/.ollama
    networks:
      - recallum
    mem_limit: 1536m
    restart: unless-stopped
    # Intentionally no published ports: private network only.
    # Pull the model once: docker compose exec ollama ollama pull embeddinggemma:300m-qat-q4_0

networks:
  recallum:
    driver: bridge

volumes:
  pgdata:
  ollama:
